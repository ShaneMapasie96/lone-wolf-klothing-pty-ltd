trigger:
- main

pool:
  vmImage: windows-latest

steps:
- task: CopyFiles@2
  displayName: 'Copy Website Files'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: |
      **/*
      !.git/**/*
      !azure-pipelines.yml
    TargetFolder: '$(Build.ArtifactStagingDirectory)/website'
    CleanTargetFolder: true
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/website'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/lone-wolf-website.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Website Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/lone-wolf-website.zip'
    ArtifactName: 'lone-wolf-website'
    publishLocation: 'Container'