name: Playwright Production Regression

on:
  workflow_run:
    workflows: ["Selenium Smoke After Website Deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CI: 'true'
      PROD_URL: 'https://lonewolfklothing.co.za'

    defaults:
      run:
        working-directory: playwright-tests

    steps:
      - name: Check out Playwright test repository
        uses: actions/checkout@v7
        with:
          repository: ShaneMapasie96/lone-wolf-klothing-playwright-automation
          token: ${{ secrets.PLAYWRIGHT_REPO_TOKEN }}
          path: playwright-tests
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run production regression tests
        run: npm run test:prod

      - name: Upload reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-prod-results
          path: |
            playwright-tests/playwright-report/
            playwright-tests/test-results/
          if-no-files-found: warn
          retention-days: 7
