name: Website UAT to Production
permissions:
  contents: read
concurrency:
  group: website-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Prepare static website once
      env:
        DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        mkdir -p site
        cp index.html 404.html robots.txt sitemap.xml site/
        cp -R 6-panel-caps accessories-pages beanies body-warmers bucket-hats clothing-pages clothing-stylesheets company-page-stylesheets company-pages crewnecks downloads get-help-pages get-help-stylesheets golfers home-page home-stylesheet hoodies images javascript-files puffer-jackets shorts sweatpants t-shirts tracksuits vests site/
        touch site/.nojekyll
        printf "%s" "$DEPLOY_ID" > site/deployment-version.txt
    - uses: actions/upload-artifact@v7
      with:
        name: website-files
        path: site/
        include-hidden-files: true
        retention-days: 7
  deploy-uat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: website-files
        path: site
    - name: Check out UAT hosting repository
      uses: actions/checkout@v7
      with:
        repository: ShaneMapasie96/lone-wolf-klothing-uat
        ref: main
        token: ${{ secrets.UAT_REPO_TOKEN }}
        path: uat-host
    - name: Publish website files to UAT
      run: |
        rsync -a --delete --exclude='.git/' site/ uat-host/
        printf '%s\n' 'uat.lonewolfklothing.co.za' > uat-host/CNAME
        cd uat-host
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add --all
        git commit -m "Deploy UAT ${GITHUB_SHA}"
        git push origin HEAD:main
    - name: Wait for this deployed version
      run: python .github/scripts/wait-for-site.py
      env:
        SITE_URL: https://uat.lonewolfklothing.co.za
        DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  selenium-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: selenium-tests
    steps:
    - name: Check out Selenium test repository
      uses: actions/checkout@v7
      with:
        repository: ShaneMapasie96/lone-wolf-klothing-selenium-automation
        token: ${{ secrets.SELENIUM_REPO_TOKEN }}
        path: selenium-tests
        persist-credentials: false
    - name: Set up Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: selenium-tests/pom.xml
    - name: Run UAT smoke tests
      run: mvn -B clean test "-DbaseUrl=https://uat.lonewolfklothing.co.za" "-Dheadless=true"
    - name: Upload test reports and screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: selenium-smoke-results
        path: |
          selenium-tests/**/target/surefire-reports/**
          selenium-tests/**/target/screenshots/**
        if-no-files-found: warn
        retention-days: 7
    needs: deploy-uat
  deploy-production:
    needs: selenium-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/configure-pages@v5
    - uses: actions/download-artifact@v8
      with:
        name: website-files
        path: site
    - uses: actions/upload-pages-artifact@v4
      with:
        path: site
    - name: Deploy production
      id: deployment
      uses: actions/deploy-pages@v4
  playwright-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PROD_URL: https://lonewolfklothing.co.za
    defaults:
      run:
        working-directory: playwright-tests
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Wait for this deployed version
      run: python .github/scripts/wait-for-site.py
      env:
        SITE_URL: https://lonewolfklothing.co.za
        DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      working-directory: ${{ github.workspace }}
    - name: Check out Playwright test repository
      uses: actions/checkout@v7
      with:
        repository: ShaneMapasie96/lone-wolf-klothing-playwright-automation
        token: ${{ secrets.PLAYWRIGHT_REPO_TOKEN }}
        path: playwright-tests
        persist-credentials: false
    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: playwright-tests/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Install Chromium
      run: npx playwright install chromium
    - name: Run production regression tests
      run: npm run test:prod
    - name: Upload reports and failure evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-prod-results
        path: |
          playwright-tests/playwright-report/
          playwright-tests/test-results/
        if-no-files-found: warn
        retention-days: 7
    needs: deploy-production
on:
  push:
    branches:
    - main
  workflow_dispatch: null
